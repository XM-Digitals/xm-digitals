<div class="landing-insight">
  <div class="blog-area bg-theme space">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xxl-7 col-xl-6 col-lg-8">
          <div class="title-area text-center">
            <h2 class="sec-title">Digital Tech Insights</h2>
          </div>
        </div>
      </div>
      <div class="row gy-30 justify-content-center">
        @for (list of listInsights; track $index) {
          <div class="col-lg-4 col-md-6">
            <a [routerLink]="['/insight', list?.slug]" class="blog-card style2">
              <div class="blog-img">
                <img src="{{ list?.banner }}" alt="blog image">
              </div>
              <div class="blog-content">
                <div class="post-meta-item blog-meta">
                  <span>{{ list?.date }}</span>
                  <span>{{ list?.category }}</span>
                </div>
                <h4 class="blog-title">{{ list?.title }}</h4>
                <span class="link-btn">
                  <span class="link-effect">
                    <span class="effect-1">READ MORE</span>
                    <span class="effect-1">READ MORE</span>
                  </span>
                  <img src="assets/images/icon/arrow-left-top.svg" alt="icon">
                </span>
              </div>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
