<div class="landing-insight">
  <div class="blog-area bg-theme space">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xxl-7 col-xl-6 col-lg-8">
          <div class="title-area text-center">
            <h2 class="sec-title">Digital Tech Insights</h2>
          </div>
        </div>
      </div>
      <div class="row gy-30 justify-content-center">
        @for (list of listInsights; track list.slug; let i = $index) {
          <div class="col-lg-4 col-md-6">
            <a [routerLink]="['/insight', list?.slug]" class="blog-card style2">
              <div class="blog-img" [class.is-loaded]="loadedImages[list.slug]">
                @if (!loadedImages[list.slug]) {
                  <div class="img-skeleton" aria-hidden="true">
                    <div class="skeleton-frame">
                      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                      </svg>
                    </div>
                  </div>
                }
                <img
                  [src]="list?.banner"
                  [alt]="list?.title || 'Insight thumbnail'"
                  [attr.loading]="i < 3 ? 'eager' : 'lazy'"
                  decoding="async"
                  (load)="onImageLoad(list.slug)"
                  (error)="onImageError(list.slug)"
                >
              </div>
              <div class="blog-content">
                <div class="post-meta-item blog-meta">
                  <span>{{ list?.date | date: 'dd MMMM y' }}</span>
                  <span>{{ list?.category }}</span>
                </div>
                <h4 class="blog-title">{{ list?.title }}</h4>
                <span class="link-btn">
                  <span class="link-effect">
                    <span class="effect-1">READ MORE</span>
                    <span class="effect-1">READ MORE</span>
                  </span>
                  <img src="assets/images/icon/arrow-left-top.svg" alt="icon">
                </span>
              </div>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
