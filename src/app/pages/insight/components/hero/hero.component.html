@if (insight) {
  <header class="hero-wrapper detail-insight hero-7" id="hero">
    <div class="bg-title">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-12">
            <div class="hero-style7 text-center">
              <h1 class="hero-title wow img-custom-anim-top">{{ insight.title }}</h1>
              <p class="hero-text wow img-custom-anim-top">
                {{ insight.contentDescription }}
              </p>
              <time [attr.datetime]="insight.date" class="insight-date wow img-custom-anim-top">
                {{ insight.date | date: 'dd MMMM y' }}
              </time>
            </div>
          </div>
          <div class="col-lg-8">
            @if (insight.banner) {
              <figure class="hero-7-thumb wow img-custom-anim-top" data-wow-duration="1.5s" data-wow-delay="0.2s">
                <img [src]="insight.banner" [alt]="insight.title" />
                @if (insight.imageCaption) {
                  <figcaption class="insight-image-caption">
                    {{ insight.imageCaption }}
                  </figcaption>
                }
              </figure>
            }
          </div>
        </div>
      </div>
    </div>
  </header>
}
