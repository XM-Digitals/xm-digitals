@if (service) {
  @for (current of [service]; track current.title) {
    <div class="about-area-1 services space bg-theme">
      <div
        class="about-img-1-1 shape-mockup hero-reveal-left"
        [class.xm-creative]="isXmCreative()"
        [class.xm-tech]="isXmTech()"
        [class.xm-ai]="isXmAi()"
        [class.xm-growth]="isXmGrowth()"
        data-left="0"
        data-top="-100px"
        data-bottom="140px"
      >
        <img [src]="current.banner" [alt]="current.title" fetchpriority="high" loading="eager" />

        @if (isXmCreative()) {
          <div class="xm-visor-glow"></div>
        }

        @if (isXmTech()) {
          <div class="xm-laptop-screen">
            <img
              src="assets/images/logo-xm-white-with-tagline.png"
              alt="XM Creative. Tech. AI."
              class="xm-screen-logo"
            />
          </div>
        }

        @if (isXmGrowth()) {
          <div class="xm-growth-accent"></div>
        }
      </div>

      <div class="container">
        <div class="row align-items-center justify-content-end">
          <div class="col-lg-6">
            <div class="overflow-hidden">
              <div class="about-content-wrap">
                <div class="title-area mb-0">
                  <h1 class="sec-title">{{ current.title }}</h1>
                  <p class="sec-text mt-35">{{ current.description }}</p>
                  <div class="btn-wrap mt-20">
                    <a target="_blank" [href]="current.ctaUrl" class="btn">
                      <span class="link-effect">
                        <span class="effect-1">{{ current.ctaTitle }}</span>
                        <span class="effect-1">{{ current.ctaTitle }}</span>
                      </span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
}
